<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PyVault</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head><body>
<section id="auth-view" class="screen"><div class="auth-card"><h1>PyVault</h1><p class="tagline">Secure, self-hostable password manager.</p><div class="tabs"><button class="tab-btn active" data-tab="login">Sign in</button><button class="tab-btn" data-tab="register">Create account</button></div>
<form id="login-form" class="auth-form"><label>Username</label><input id="login-username" autocomplete="username" required><label>Master password</label><input id="login-password" type="password" autocomplete="current-password" required><button class="btn-primary">Unlock vault</button><p id="login-message" class="form-message"></p></form>
<form id="register-form" class="auth-form hidden"><label>Username</label><input id="register-username" minlength="3" required><label>Master password</label><input id="register-password" type="password" minlength="8" required><label>Confirm master password</label><input id="register-password-confirm" type="password" minlength="8" required><button class="btn-primary">Create vault</button><p id="register-message" class="form-message"></p></form></div></section>
<section id="app-view" class="screen hidden"><header class="app-header"><div class="brand">🔐 PyVault</div><div class="header-right"><span id="whoami"></span><button id="settings-btn" class="btn-ghost">Settings</button><button id="logout-btn" class="btn-ghost">Sign out</button></div></header><main class="dashboard"><aside class="ledger"><div class="ledger-head"><h2>Entries</h2><button id="new-entry-btn" class="btn-small">+ New</button></div><ul id="service-list" class="service-list"></ul><p id="empty-state" class="empty-state hidden">No entries yet.</p></aside><section class="detail-pane">
<article id="entry-detail" class="entry-card hidden"><div class="entry-card-head"><h2 id="detail-service"></h2><button id="delete-entry-btn" class="btn-danger-ghost">Delete</button></div><dl class="entry-fields"><dt>Username</dt><dd><span id="detail-username" class="mono"></span><button class="copy-btn" data-copy-target="detail-username">Copy</button></dd><dt>Password</dt><dd><span id="detail-password" class="mono secret masked"></span><button id="reveal-password-btn" class="reveal-btn">Show</button><button class="copy-btn" data-copy-target="detail-password">Copy</button></dd><dt>Notes</dt><dd><span id="detail-notes"></span></dd></dl></article>
<article id="entry-form-card" class="entry-card hidden"><h2>New entry</h2><form id="entry-form"><label>Service</label><input id="entry-service" required placeholder="e.g. github.com"><label>Username</label><input id="entry-username"><label>Password</label><div class="password-row"><input id="entry-password" required><button type="button" id="generate-btn" class="btn-small">Generate</button></div><div id="generator-options" class="hidden"><label>Length: <span id="gen-length-value">20</span></label><input type="range" id="gen-length" min="8" max="64" value="20"><label><input type="checkbox" id="gen-symbols" checked> Include symbols</label></div><label>Notes</label><textarea id="entry-notes" rows="3"></textarea><div class="form-actions"><button class="btn-primary">Save entry</button><button type="button" id="cancel-entry-btn" class="btn-ghost">Cancel</button></div><p id="entry-form-message" class="form-message"></p></form></article><div id="no-selection" class="no-selection"><p>Select an entry, or create a new one.</p></div></section></main>
<div id="settings-overlay" class="overlay hidden"><div class="overlay-card"><h2>Change master password</h2><form id="settings-form"><label>New master password</label><input id="new-master-password" type="password" minlength="8" required><label>Confirm new master password</label><input id="new-master-password-confirm" type="password" minlength="8" required><div class="form-actions"><button class="btn-primary">Update password</button><button type="button" id="settings-cancel-btn" class="btn-ghost">Cancel</button></div><p id="settings-message" class="form-message"></p></form></div></div></section>
<script src="{{ url_for('static',filename='app.js') }}"></script></body></html>
